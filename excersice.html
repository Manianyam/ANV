<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <button onclick=" game('rock');">rock</button>
   <button onclick="game('paper');">paper</button>
   <button onclick="game('scissors');">scissors</button>
   <p class="js-choice"></p>
   <p class="js-result"></p>
   <p class="js-score"></p>

   <button onclick=" score.wins=0; score.looses=0;score.ties=0; localStorage.removeItem('score') ; updateScore();">Reset Scores</button>
<script>
     let result = '';
     
     let random='';
    let score =JSON.parse(localStorage.getItem("score")); 
    if (!score) {
       score = { wins: 0, losses: 0, ties: 0 };
         };
   
     updateScore();
  function game(key){
     myFunction();
    
    if (key === 'scissors'){
       if (random==='scissors'){result=`Tie`; }
       else if(random==='rock'){result=`You Loose`;}
       else if(random==='paper'){result=`You Win`;}
      }
    
    
    else if (key==='paper'){
       if (random==='paper'){result=`Tie`;}
       else if(random==='scissors'){result=`You Loose`;}
       else if(random==='rock'){result=`You Win`;}
      }



    else if (key=== 'rock'){
        if (random==='rock'){result=`Tie`;}
         else if(random==='paper'){result=`You Loose`;}
         else if(random==='scissors'){result=`You Win`;}
        }



    
   if (result ===`Tie`){
      score.ties +=1;
       }
   
   else if(result ===`You Loose`){score.looses +=1;}
   
   else {
      score.wins +=1;
   }
   
   localStorage.setItem("score",JSON.stringify(score));

      updateScore();
    document.querySelector('.js-choice').innerHTML = `You choose ${key} ,Computer ${random}`;
     document.querySelector('.js-result').innerHTML = result;
    }
   
   
   function myFunction() {
     const computer= Math.random();
   
    if (0 <=computer && computer< 1/3){
        random ='rock';
    }else if (1/3<=computer && computer< 2/3){
        random='paper';
    }   
    else {
        random='scissors';
    }}
  function updateScore() {
            document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }
     console.log(result)
 
</script>
</body>
</html>
